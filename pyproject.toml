[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netdoctor-agent"
version = "0.1.0"
requires-python = ">=3.10"
description = "NetDoctor network measurement agent"

[project.scripts]
netdoctor-agent = "netdoctor.main:main"

[tool.setuptools.packages.find]
include = ["netdoctor*"]
